name = "kr-proposal-intake"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Comma-separated list of origins allowed to POST to this worker.
# Update to your real deployed domain(s) before going live.
[vars]
ALLOWED_ORIGIN = "https://krijjal.github.io"

# Create with: wrangler kv namespace create RATE_LIMIT_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "0f611127517c49889c8c8a6ad0fd536a"

# Secrets (never put these in this file — set via `wrangler secret put`):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   TURNSTILE_SECRET_KEY   (optional)
